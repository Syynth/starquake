# cargo-deny: supply-chain policy for the dependency graph.
# Run locally with `cargo deny check`; `cargo xtask ci` runs it when the tool is installed and
# CI always runs it (see xtask/src/main.rs and .github/workflows/ci.yml).

[advisories]
# Fail on security vulnerabilities (RUSTSEC) and on yanked crates.
yanked = "deny"
# Known-and-accepted advisories go here with a reason and a note on when to re-check; none yet.
ignore = []

[licenses]
# Every crate in the graph must resolve to one of these. All are permissive licences that can be
# combined into a GPL-3.0-or-later work; GPL-3.0-or-later itself is the licence of the workspace
# crates. Add a licence only after checking it is GPL-3.0-or-later compatible.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list is deliberately wider than today's graph, so new permissive dependencies do not fail the
# gate; unused entries are not noise.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are common and mostly unavoidable; surface them without failing the gate.
multiple-versions = "warn"
# Registry dependencies must name a version (workspace crates are path dependencies).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io is the only source: no git dependencies, no alternate registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
