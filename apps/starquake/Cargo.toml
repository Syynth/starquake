[package]
name = "starquake"
description = "Starquake command-line frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
starquake-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
starquake-testkit.workspace = true
# Reads back the flight-recorder dump the command wrote.
starquake-trace.workspace = true
serde_json.workspace = true
# Builds the synthetic NUP files that the `inspect` and `verify` tests read.
starquake-loader = { workspace = true, features = ["test-support"] }
# Build the messages of the synthetic guest that `run_log.rs` runs, with the service ids and
# names it asks for.
starquake-ipc.workspace = true
starquake-services.workspace = true
# Build the synthetic GPU captures that `gpu_replay.rs` replays.
starquake-gpu = { workspace = true, features = ["test-support"] }
starquake-memory.workspace = true
