[package]
name = "starquake"
description = "Starquake command-line frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
starquake-core.workspace = true
thiserror.workspace = true

[dev-dependencies]
starquake-testkit.workspace = true
# Reads back the flight-recorder dump the command wrote.
starquake-trace.workspace = true
serde_json.workspace = true
# Builds the synthetic NUP files that the `inspect` and `verify` tests read.
starquake-loader = { workspace = true, features = ["test-support"] }
