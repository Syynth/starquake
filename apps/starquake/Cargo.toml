[package]
name = "starquake"
description = "Starquake command-line frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["wgpu"]
# The wgpu render backend, the default backend of a run where it is built, and `--window`, which
# needs it (docs/specs/render-backend.md, slice R12; `starquake_core::renderer`).
wgpu = ["starquake-core/wgpu", "dep:winit", "dep:objc2"]

[dependencies]
starquake-core.workspace = true
thiserror.workspace = true
# The window of `run --window` (src/window.rs).
winit = { workspace = true, optional = true }

# Whether `run --window` is on the main thread, where AppKit makes windows (src/window.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }

[dev-dependencies]
starquake-testkit.workspace = true
# Reads back the flight-recorder dump the command wrote.
starquake-trace.workspace = true
serde_json.workspace = true
# Builds the synthetic NUP files that the `inspect` and `verify` tests read.
starquake-loader = { workspace = true, features = ["test-support"] }
# Build the messages of the synthetic guest that `run_log.rs` runs, with the service ids and
# names it asks for.
starquake-ipc.workspace = true
starquake-services.workspace = true
# Build the synthetic GPU captures that `gpu_replay.rs` replays.
starquake-gpu = { workspace = true, features = ["test-support"] }
starquake-memory.workspace = true
