name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest] # macOS arm64, Linux x86-64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - run: cargo xtask ci
