# Dependencies that are declared but not used yet, because the crate is a scaffold and the task
# that uses them has not landed. `cargo xtask ci` runs `cargo machete` and compares its findings
# with this list in both directions (see xtask/src/unused_deps.rs):
#
#   - a finding that is not listed here fails the gate: remove the dependency, or list it with
#     the reason it is declared early;
#   - an entry here that `cargo machete` no longer reports fails the gate too: the dependency is
#     now used (or gone), so delete the entry in the same change.
#
# What is covered: `cargo machete` 0.9.2 analyses only a package's top-level `[dependencies]`
# table. The unused entries in `[dev-dependencies]`, `[build-dependencies]` and `[target.*]`
# tables are found by the gate's `table-deps` step (xtask/src/table_deps.rs): a dependency is
# unused there when no source file of the crate names it (a build dependency: when the build
# script does not). `ignored = [...]` under `[package.metadata.cargo-machete]` or
# `[workspace.metadata.cargo-machete]` is refused by the gate: this file is the only way to
# excuse an unused dependency, and every entry here has a reason.
#
# `[[allow_tables]]` is the same list for that step (the `package` key is the crate's name): a
# dev, build or target-specific dependency that the text search cannot see being used (its
# library name differs from the package name, or only a macro expansion names it), or that is
# declared ahead of its task. It is exact in both directions like the others.
#
# `[[allow_workspace]]` is the same for the root Cargo.toml's `[workspace.dependencies]`: a registry
# dependency declared there that no member inherits (`name.workspace = true`).
#
# `package` is the package name as `cargo machete` prints it, which is also the name in the
# crate's own Cargo.toml. Each entry has a non-blank `reason`; an entry names the planned task or
# the document row that says why the dependency is wanted.

[[allow]]
package = "starquake-core"
dependencies = [
    "starquake-gpu",
    "starquake-gsv",
    "starquake-render",
    "starquake-shader",
]
reason = "core wires the whole stack (docs/architecture.md, 'Crates and dependency direction'); the walking skeleton joins the loader, cpu, kernel, trace, IPC and service crates, and the graphics layers join it as later milestones land (docs/roadmap.md, 'Route to milestone 1')"

[[allow]]
package = "starquake-gpu"
dependencies = ["starquake-memory", "starquake-render", "starquake-shader"]
reason = "gpu depends on memory, shader and render (docs/architecture.md, 'Crates and dependency direction'); the front reads pushbuffers from guest memory and the back records into the render backend, neither of which is written yet (only the macro interpreter is)"

[[allow]]
package = "starquake-gpu"
dependencies = ["tracing"]
reason = "engine and front/back logging arrives with the command processor; only the macro interpreter exists"

[[allow]]
package = "starquake-gsv"
dependencies = ["starquake-gpu", "starquake-ipc", "starquake-kernel", "starquake-services"]
reason = "the graphics service layer sits on services and gpu (docs/architecture.md); the crate is a scaffold with no code yet"

[[allow]]
package = "starquake-gsv"
dependencies = ["thiserror", "tracing"]
reason = "error type and logging arrive with the crate's first handler"

[[allow]]
package = "starquake-shader"
dependencies = ["thiserror"]
reason = "scaffold crate with no code; its error type arrives with the first translator pass"
