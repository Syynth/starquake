[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/*", "xtask"]
# Folders under tools/ that hold scripts, not crates: the reference emulator's patch and scripts
# (docs/reference-emulator.md) and the agent workflow script (tools/pump/README.md).
exclude = ["tools/oracle", "tools/pump"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.100"
publish = false

# Every dependency is declared here with its version; crates use `dep.workspace = true`.
[workspace.dependencies]
starquake-core = { path = "crates/core" }
starquake-cpu = { path = "crates/cpu" }
starquake-gpu = { path = "crates/gpu" }
starquake-gsv = { path = "crates/gsv" }
starquake-ipc = { path = "crates/ipc" }
starquake-kernel = { path = "crates/kernel" }
starquake-layout = { path = "crates/layout" }
starquake-loader = { path = "crates/loader" }
starquake-memory = { path = "crates/memory" }
starquake-render = { path = "crates/render" }
starquake-services = { path = "crates/services" }
starquake-shader = { path = "crates/shader" }
starquake-testkit = { path = "crates/testkit" }
starquake-trace = { path = "crates/trace" }

lz4_flex = "0.14.0"
# Shader IR: the shader crate hands out a validated naga module (docs/specs/shader-pipeline.md,
# "The backend through naga") and the render crate's `ShaderSource::Naga` carries it
# (docs/specs/render-backend.md, "Where the backend sits"). Pinned exactly to the naga wgpu 30.0.x
# uses, so the shader, gpu and render crates share one naga with wgpu (owner's decision of
# 2026-11-12); upgrade it together with wgpu. No features here: the render crate only names the
# module types.
naga = "=30.0.1"
sha2 = "0.11.1"
# Pure-Rust zstd decoder for NUP containers (crates/loader/src/nup.rs): the format stores each
# compressed file as one zstd frame (docs/references.md, `nup`). Without default features: the
# `hash` feature only adds an xxHash the reader does not need (it checks SHA-256 itself).
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
# PNG encoding of frame dumps in the render crate (docs/specs/render-backend.md, "Frame dumps and
# headless runs"). Pure Rust, as are its dependencies (crc32fast, fdeflate, flate2 on miniz_oxide).
png = "0.18.1"
# The main-thread check before the wgpu backend makes a window's surface on macOS
# (crates/render-wgpu, slice R8): wgpu panics when a window's Metal layer is attached off the main
# thread, and `objc2::MainThreadMarker::new()` asks without unsafe code. Already in the tree, at
# this version, through wgpu's Metal backend.
objc2 = "0.6.5"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# The window handles of a present target (docs/specs/render-backend.md, "Present targets": the
# frontend's `raw-window-handle` 0.6.2 display and window handles; slice R8). Only the traits,
# without `std`; `alloc` gives `Arc<dyn ..>` the traits, so the frontend's window can be shared.
# Already in the tree, at this version, through wgpu.
raw-window-handle = { version = "0.6.2", default-features = false, features = ["alloc"] }
serde ={ version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1.44"

# Dev-only
# A second ASTC decoder, for the render crate's tests to compare its CPU decoder with
# (docs/specs/render-backend.md, slice R3). Pure Rust, no dependencies of its own.
astc-decode = "0.3.1"
insta = "1.49.0"
proptest = "1.12.0"
# The wgpu render backend (crates/render-wgpu, docs/specs/render-backend.md, slice R5), and the
# shader crate's device tests (experiment E1 and the wgpu acceptance tests,
# docs/specs/shader-pipeline.md, "What to verify before building"). Takes a naga module directly
# (`naga-ir`); Metal on macOS, Vulkan elsewhere. 30.0.2 rather than the spec's 30.0.1: the patch
# release fixes a use-after-free when a mapped buffer is destroyed (the backend's readbacks map
# buffers) and still takes naga 30.0.x, so the naga pin above is unchanged. Pinned with naga.
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "metal", "vulkan", "naga-ir"] }

# Cargo's own unused-dependency lints (new in Rust 1.100) cannot say why a dependency is declared
# ahead of the task that uses it. The gate's unused-dependency check is the authority instead:
# every exception is listed with a reason in xtask/unused-deps.toml, exact in both directions.
[workspace.lints.cargo]
unused_dependencies = "allow"
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
# Denied everywhere; the few crates that must talk to the host or run guest code (cpu, later
# render) opt in with a crate-level `#![expect(unsafe_code, reason = "...")]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
missing_docs = "warn"

# The gate runs clippy with -D warnings, so every "warn" here fails CI.
[workspace.lints.clippy]
# Pedantic baseline
pedantic = { level = "warn", priority = -1 }

# Pedantic allows (only what's genuinely noisy/premature)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Cargo group
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
# Nothing here is published, so repository/readme/keywords metadata would be noise.
cargo_common_metadata = "allow"
# The test strategy names the feature behind which a crate exports its fakes `test-support`
# (`docs/specs/testing.md`, "Shared test support"); this lint objects to the "-support" suffix.
redundant_feature_names = "allow"

# Restriction lints: cherry-picked for real bug prevention
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
wildcard_dependencies = "deny"
exit = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
rest_pat_in_fully_bound_structs = "warn"
verbose_file_reads = "warn"
allow_attributes = "warn"

# No debug info in dev builds: it is most of a build folder's size, and several agents build in
# separate worktrees at once.
[profile.dev]
debug = 0
# With no debug info cargo would strip the standard library's, using the toolchain's bundled
# rust-objcopy. On macOS that tool fails to load its LLVM library in 1.99.1 and every build prints
# a warning, so leave binaries unstripped.
strip = "none"

# Emulators are unusably slow unoptimised; keep our crates quick to rebuild but optimise deps.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
