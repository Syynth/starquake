[workspace]
resolver = "3"
members = ["apps/*", "crates/*", "tools/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "forbid"

# The gate runs clippy with -D warnings, so every "warn" here fails CI.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Emulators are unusably slow unoptimised; keep our crates quick to rebuild but optimise deps.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = "line-tables-only"
