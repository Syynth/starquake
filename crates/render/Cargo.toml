[package]
name = "starquake-render"
description = "Host rendering backend trait (Vulkan, Metal)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exports `capture::CaptureBuilder`, which writes render captures with no backend, for other
# crates' tests (`docs/specs/testing.md`, "Shared test support"; render-backend, "Render capture
# v2").
test-support = []

[dependencies]
naga.workspace = true
png.workspace = true
postcard.workspace = true
raw-window-handle.workspace = true
serde.workspace = true
# SHA-256 of a render capture's dumped frames and of its shader sources (render-backend, "Render
# capture v2").
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
astc-decode.workspace = true
insta.workspace = true
# naga's WGSL front end, for the tests that parse and validate the host shaders
# (src/host_shaders.rs): the library only holds their sources.
naga = { workspace = true, features = ["wgsl-in"] }
proptest.workspace = true
