[package]
name = "starquake-services"
description = "HLE system services (sm, fs, am, hid, audio, ...)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Test doubles (`framework::fake`) for this crate's own tests and for downstream crates' dev
# builds: the name every crate gives the feature that exports its fakes
# (`docs/specs/testing.md`, "Shared test support").
test-support = []

[dependencies]
starquake-kernel.workspace = true
starquake-ipc.workspace = true
starquake-trace.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Turns `test-support` on for this crate's unit tests, integration tests and doctests.
starquake-services = { workspace = true, features = ["test-support"] }
proptest.workspace = true
