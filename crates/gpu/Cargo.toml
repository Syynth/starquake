[package]
name = "starquake-gpu"
description = "GPU command processing: GPFIFO, engines, MME, caches"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exports `memory::TestGpuMemory`, a `GpuMemory` over a page table of guest memory, for other
# crates' tests (`docs/specs/testing.md`, "Shared test support").
test-support = []

[dependencies]
starquake-layout.workspace = true
starquake-memory.workspace = true
starquake-shader.workspace = true
starquake-render.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
proptest.workspace = true
# Golden draw descriptions (slice G18).
insta.workspace = true
# The test assembler, to translate real programs for the draw path's fake shader cache (G18).
starquake-shader = { workspace = true, features = ["test-support"] }
# `FakeWatchKernel`, for the buffer cache's tests (slice G16).
starquake-memory = { workspace = true, features = ["test-support"] }