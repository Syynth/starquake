[package]
name = "starquake-render-wgpu"
description = "The wgpu render backend: the only crate that names a wgpu type"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
starquake-render.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

[dev-dependencies]
# naga's WGSL front end, for the pipeline tests' hand-written shader modules
# (src/pipeline/tests.rs); the library takes naga IR only, through wgpu's re-export.
naga = { workspace = true, features = ["wgsl-in"] }
