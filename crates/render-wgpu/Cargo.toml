[package]
name = "starquake-render-wgpu"
description = "The wgpu render backend: the only crate that names a wgpu type"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# naga's WGSL front end parses the render crate's host shaders into the modules their shaders
# are made from: the present blit's `present.wgsl` (R4, slice R8) and the drawn clear's
# `clear.wgsl` (`crate::clear::Drawer::new`). The workspace's wgpu has no WGSL front end of its
# own.
naga = { workspace = true, features = ["wgsl-in"] }
starquake-render.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true

# The main-thread check before a window's surface is made (src/window.rs, slice R8).
[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true

