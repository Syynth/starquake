[package]
name = "starquake-core"
description = "Wires the emulator together: system, timing, configuration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Builds the wgpu render backend into runs (docs/specs/render-backend.md, "Where the backend
# sits": "`core` picks a backend by `cfg` and Cargo features"; slice R12). Off here, on in the
# command-line app's default features: where it is built, a run renders with it by default
# (`renderer`). Without it a run has the recording backend only.
wgpu = ["dep:starquake-render-wgpu"]

[dependencies]
starquake-memory.workspace = true
starquake-cpu.workspace = true
starquake-ipc.workspace = true
starquake-kernel.workspace = true
starquake-loader.workspace = true
starquake-services.workspace = true
starquake-shader.workspace = true
starquake-render.workspace = true
starquake-render-wgpu = { workspace = true, optional = true }
starquake-gpu.workspace = true
starquake-gsv.workspace = true
starquake-trace.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
starquake-cpu = { workspace = true, features = ["test-support"] }
starquake-kernel = { workspace = true, features = ["test-support"] }
starquake-testkit.workspace = true
insta.workspace = true
# Decodes the frame dumps a run writes, in the `frames` module's tests.
png.workspace = true
# Lays out the block-linear image the frame-dump tests present.
starquake-layout.workspace = true
# Builds the synthetic NUP titles that the `title` module's tests load.
starquake-loader = { workspace = true, features = ["test-support"] }
# The capture builder, for the `gpu_replay` module's tests.
starquake-gpu = { workspace = true, features = ["test-support"] }
