[package]
name = "starquake-gsv"
description = "Graphics server: gsv, syncpt, GPU VM, vi2, codec sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
starquake-kernel.workspace = true
starquake-services.workspace = true
starquake-gpu.workspace = true
starquake-memory.workspace = true
starquake-trace.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# The services framework's fake kernel and host (`framework::fake`), which the root's tests drive.
starquake-services = { workspace = true, features = ["test-support"] }
starquake-ipc.workspace = true
# The page's restore tests drive the kernel's own dispatcher: a guest's registers.
starquake-cpu.workspace = true
# The native image sizer's cross-check against the layout crate (graphics-server slice 8; review
# guide, M8): a dev-dependency only, as the spec asks.
starquake-layout.workspace = true
proptest.workspace = true
