[package]
name = "starquake-cpu"
description = "Guest CPU execution behind pluggable backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exports `testing::ScriptedVcpu`, a `Vcpu` that plays back scripted exits, for other crates'
# tests (`docs/specs/testing.md`, "Shared test support").
test-support = []

[dependencies]
starquake-memory.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The hypervisor tests run the loader's patched counter reads beside the shim's unpatched ones
# (`tests/hvf.rs`, "Counter scale"): the two must agree, and only the patcher's own output shows
# that. A dev-dependency only; the loader depends on no crate above `memory`.
starquake-loader.workspace = true
